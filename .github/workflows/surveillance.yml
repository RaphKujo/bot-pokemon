name: Surveillance  # toutes les 5 minutes

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      diagnostic:
        description: "Tester les boutiques et envoyer le bilan sur Discord"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: surveillance
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lancer le bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m bot.main ${{ inputs.diagnostic && '--diagnostic' || '' }}
      - name: Enregistrer les prix
        run: |
          git config user.name "bot-pokemon"
          git config user.email "bot-pokemon@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || { git commit -q -m "Mise à jour des prix"; git push -q; }
