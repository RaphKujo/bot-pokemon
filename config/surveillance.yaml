# Ce que le bot surveille. Modifie ce fichier pour ajouter une série ou changer un prix.
#
# mode: prix  -> alerte si le produit est disponible à +15 % maximum du prix de base.
# mode: stock -> alerte dès le retour en stock, sauf si un prix_max est dépassé.
# priorite: haute -> l'alerte Discord mentionne @everyone.

seuil_pct: 15             # marge autorisée au-dessus du prix de base
baisse_min_pct: 5         # nouvelle alerte si le prix baisse d'au moins 5 %
anti_rebond_minutes: 60   # évite les alertes en boucle quand un stock clignote
types_sans_port: [booster, tripack]   # petits achats : le port se partage dans un panier

