# Ce que le bot surveille. Modifie ce fichier pour ajouter une série ou changer un prix.
#
# mode: prix  -> alerte si le produit est disponible à +15 % maximum du prix de base.
# mode: stock -> alerte dès le retour en stock, sauf si un prix_max est dépassé.
# priorite: haute -> l'alerte Discord mentionne @everyone.

page_suivi: https://raphkujo.github.io/bot-pokemon/
seuil_pct: 15             # marge autorisée au-dessus du prix de base
baisse_min_pct: 5         # nouvelle alerte si le prix baisse d'au moins 5 %
anti_rebond_minutes: 60   # évite les alertes en boucle quand un stock clignote
types_sans_port: [booster, tripack]   # petits achats : le port se partage dans un panier

series:
  - id: regne-delta
    nom: Règne Delta
    en: "Delta Reign"
    code: ME06
    priorite: haute
    mode: prix
    mots: ["regne delta", "me06", "me6"]
    # Prix relevés le 5 novembre 2026 (précommandes Amazon via ChocoBonPlan).
    # Display et booster sont déduits de 5,99 € le booster.
    prix_base:
      display: 215.64
      demi-display: 107.82
      etb: 55.99
      bundle: 35.94
      tripack: 17.99
      booster: 5.99

  - id: evolution-celeste
    nom: Évolution Céleste
    en: "Evolving Skies"
    code: EB07
    priorite: haute
    mode: stock
    mots: ["evolution celeste", "evolutions celestes", "eb07", "eb7"]

  - id: 30-ans
    nom: 30ᵉ Anniversaire
    en: "30th Celebration"
    priorite: normale
    mode: prix
    mots: ["30e anniversaire", "30eme anniversaire", "30 ans"]
    prix_base:
      etb: 55.99
      bundle: 35.99
      coffret: 24.99

  - id: mega-evolution
    nom: Méga-Évolution
    en: "Mega Evolution"
    code: ME01
    priorite: normale
    mode: stock
    mots: ["me01", "me1", "mega evolution"]
    exclure: ["me02", "flammes fantasmagoriques", "heros transcendants", "me03",
              "equilibre parfait", "me04", "chaos ascendant", "me05", "nuit noire",
              "me06", "regne delta", "30e", "30eme", "30 ans", "anniversaire", "energies"]

  - id: foudre-noire
    nom: Foudre Noire
    en: "Black Bolt"
    code: EV10.5
    priorite: normale
    mode: stock
    mots: ["foudre noire"]

  - id: flamme-blanche
    nom: Flamme Blanche
    en: "White Flare"
    code: EV10.5
    priorite: normale
    mode: stock
    mots: ["flamme blanche", "flammes blanches"]

  - id: destinees-de-paldea
    nom: Destinées de Paldea
    en: "Paldean Fates"
    code: EV04.5
    priorite: normale
    mode: stock
    mots: ["destinees de paldea", "destinee de paldea", "ev04 5", "ev4 5"]

  - id: "151"
    nom: "151"
    en: "151"
    code: EV03.5
    priorite: normale
    mode: stock
    mots: ["151", "ev03 5", "ev3 5"]

  - id: tempete-argentee
    nom: Tempête Argentée
    en: "Silver Tempest"
    code: EB12
    priorite: normale
    mode: stock
    mots: ["tempete argentee", "eb12"]

  - id: origine-perdue
    nom: Origine Perdue
    en: "Lost Origin"
    code: EB11
    priorite: normale
    mode: stock
    mots: ["origine perdue", "eb11"]

