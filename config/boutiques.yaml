# Boutiques surveillées.
# port: estimation utilisée dans le calcul. Remplace-la par le vrai tarif si tu le connais.
# franco: montant à partir duquel la livraison est offerte.
delai_secondes: 2      # pause entre deux requêtes vers une boutique
pages_max: 6           # pages de catalogue lues par collection

boutiques:
  - id: kairyu
    nom: Kairyu
    type: shopify
    url: https://kairyu.fr
    collections: [fr-francais, display, collector]
    collections_cartes: [frjap-cartes]
    port: 6.90

  - id: lorenzone
    nom: LorenZone
    type: shopify
    url: https://lorenzone.fr
    collections: [produits-officiels-pokemon, precommandes]
    collections_cartes: [cartes-pokemon-unite]
    port: 6.90
    franco: 100
    note_precommande: Précommande sur invitation du Club LorenZone

  - id: coin-des-barons
    nom: Le Coin des Barons
    type: woocommerce
    url: https://lecoindesbarons.com
    categories: [display-pokemon, coffret-dresseur-delite, bundle-pokemon, tripack-pokemon, booster-pokemon, coffrets-pokemon, pokebox-pokemon, anniversaire-pokemon]
    port: 6.90

  # Recense les offres d'Amazon, Fnac, Cultura, Micromania, Leclerc et d'autres enseignes.
  - id: chocobonplan
    nom: ChocoBonPlan
    type: flux
    url: https://www.chocobonplan.com/bons-plans/c/cartes-pokemon
    flux_recent: true
    port: 0
    port_inconnu: true
    note: Repéré par ChocoBonPlan. Vérifie le prix et le stock sur le site du vendeur.

  # Boutiques lues page par page : colle ici l'adresse de chaque produit à suivre.
  # Exemple :
  #   - serie: regne-delta
  #     type: etb
  #     url: https://www.exemple.fr/produit
  - id: smyths
    nom: Smyths Toys
    type: page_produit
    port: 0
    port_inconnu: true
    pages:
      - serie: regne-delta
        type: etb
        url: https://www.smythstoys.com/fr/fr-fr/jouets/jeux-de-societe-et-puzzles/cartes-a-collectionner/cartes-pokemon/pokemon-coffret-dresseur-delite-me06-mega-evolution-regne-delta/p/261817

  - id: fnac
    nom: Fnac
    type: page_produit
    port: 0
    port_inconnu: true
    pages: []

  - id: cultura
    nom: Cultura
    type: page_produit
    port: 0
    port_inconnu: true
    pages:
      - serie: flamme-blanche
        type: etb
        url: https://www.cultura.com/p-coffret-pokemon-dresseur-d-elite-ecarlate-et-violet-flamme-blanche-11987401.html

  - id: micromania
    nom: Micromania
    type: page_produit
    port: 0
    port_inconnu: true
    pages: []

  - id: amazon
    nom: Amazon.fr
    type: page_produit
    port: 0
    port_inconnu: true
    pages: []  # Amazon bloque les robots

  - id: blazing-tail
    nom: Blazing Tail
    type: page_produit
    port: 6.90
    pages: []
